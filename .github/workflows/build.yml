name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # 正确性底线：no-undef / no-unused-vars / no-constant-binary-expression
      - run: npm run lint
      - run: node build.js
      # 产物与源码必须同步：改了 src/ 忘了重新 build 会在这里 fail
      - run: git diff --exit-code acfun-svfeed.user.js acfun-svfeed.debug.user.js
      # 静态一致性（0.9.81）：场景登记双向对齐 / 版本号-产物-CHANGELOG 三者一致 / 依赖图不缺边
      - run: npm run check
      # 回归测试：immsg 解析层单测（node:test）+ 页内断言 harness（Playwright 无头驱动）
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: node test/run-harness.mjs
      # WebKit 冒烟（跨引擎）：Playwright WebKit 没有 Chromium 的 --autoplay-policy 开关，
      # 媒体类断言（smoke/boot-home/play-cold/view-zone 的 first-play / 续播）在 WebKit 必红，
      # 故名单只保留纯 UI/契约场景（本机 WebKit 实测 7/7；CI 下 CONC=1 串行）。
      # 不选 view-im：正文收窄几何在并发多标签时受 WebKit 后台过渡动画节流影响会假红。
      # chromium 全量仍是上面的主回归。
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: WebKit smoke
        run: HARNESS_BROWSER=webkit node test/run-harness.mjs view-my,view-search,im-open,upd-open,ip-tags,composer-rich,comment-fail
