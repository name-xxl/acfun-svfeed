<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AcFun 竖滑页 - DmCanvas 绘制冒烟</title>
<style>
  body { margin: 0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f5; }
  #slide { position: relative; width: 640px; height: 360px; overflow: hidden; background: #000; }
  pre { padding: 12px 20px; color: #333; }
</style>
</head>
<body>
<div id="slide"></div>
<pre id="out">waiting…</pre>
<!-- 调试构建：testHook 模拟缝 + dm.* 埋点可用 -->
<script src="../acfun-svfeed.debug.user.js"></script>
<script>
  // ============ DmCanvas 绘制冒烟（确定性驱动） ============
  // 桌面自动化环境里合成器可能冻结（rAF/rVFC 全停），故不依赖真实视频出帧：
  // 给图层一个"手动泵帧"的 stub video，逐帧驱动 paint，断言窗口扫描/位图缓存/
  // 过期释放/seek 重置等全部路径。结果写入 window.__DM_RESULTS__。
  window.__DM_RESULTS__ = { case: 'dm-smoke', results: [], done: false };
  function rec(name, pass, info) {
    window.__DM_RESULTS__.results.push({ name: name, pass: !!pass, info: info == null ? '' : String(info) });
  }
  var out = document.getElementById('out');
  function flush() {
    var r = window.__DM_RESULTS__;
    out.textContent = r.results.map(function (x) {
      return (x.pass ? 'PASS' : 'FAIL') + '  ' + x.name + (x.info ? '  (' + x.info + ')' : '');
    }).join('\n') + '\n' + (r.done ? 'done' : 'running…');
  }
  setInterval(flush, 300);

  // 指定**归一化坐标**上的不透明像素（0–1；几何断言用：高级弹幕的绝对落点靠它钉）
  function opaqueAt(xf, yf) {
    var cv = document.querySelector('.acsv-dmcanvas');
    if (!cv) return -1;
    try {
      var d = cv.getContext('2d').getImageData(
        Math.min(cv.width - 1, Math.round(xf * cv.width)),
        Math.min(cv.height - 1, Math.round(yf * cv.height)), 1, 1).data;
      return d[3] > 0 ? 1 : 0;
    } catch (e) { return -1; }
  }

  function sampleAlpha() {
    var cv = document.querySelector('.acsv-dmcanvas');
    if (!cv) return -1;
    try {
      var d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
      var n = 0;
      for (var j = 3; j < d.length; j += 4 * 97) if (d[j] > 0) n++;
      return n;
    } catch (e) { return -1; }
  }

  // stub video：可控 currentTime + 手动泵帧的 rVFC 桩（几何与真实元素一致）
  function stubVideo() {
    var cbs = [];
    var v = {
      paused: false,
      currentTime: 0,
      getBoundingClientRect: function () {
        return { left: 0, top: 0, width: 640, height: 360 };
      },
      requestVideoFrameCallback: function (cb) { cbs.push(cb); return cbs.length; },
      cancelVideoFrameCallback: function () { },
      __pump: function (n) {
        for (var k = 0; k < n; k++) {
          var list = cbs; cbs = [];
          v.currentTime += 1 / 30;
          list.forEach(function (cb) { cb(0, { presentedFrames: k }); });
        }
      }
    };
    return v;
  }

  function makeItems(n) {
    var items = [];
    for (var i = 0; i < n; i++) {
      items.push({
        id: i, text: '弹幕测试第' + i + '条，覆盖宽度测量', at: (i % 30) * 1000,
        mode: i % 5 === 0 ? 5 : (i % 7 === 0 ? 4 : 1),
        color: i % 2 ? '#ffffff' : '#ff4444', size: 25
      });
    }
    return items;
  }

  var t0 = Date.now();
  (function boot() {
    if (!window.__ACSV_TEST__) {
      if (Date.now() - t0 > 15000) { rec('env', false, 'bundle 未就绪'); window.__DM_RESULTS__.done = true; return; }
      return setTimeout(boot, 100);
    }
    try { run(); } catch (e) {
      rec('执行异常', false, e && e.message);
      window.__DM_RESULTS__.done = true;
    }
  })();

  function run() {
    var Dm = window.__ACSV_TEST__.call('dmcanvas');
    if (!Dm || !Dm.create) { rec('模拟缝', false, 'dmcanvas hook 缺失'); window.__DM_RESULTS__.done = true; return; }
    rec('模拟缝', true);

    var slide = document.getElementById('slide');
    var v = stubVideo();
    var layer = Dm.create(slide, v);
    layer.setItems(makeItems(60));
    layer.start();

    // —— 稳定播放态：泵 90 帧（3s@30fps），窗口扫描/位图缓存/埋点结算全覆盖
    v.__pump(90);
    var st = window.__ACSV_TEST__.getStats();
    rec('dm.frame ≥ 90', (st['dm.frame'] || 0) >= 90, st['dm.frame']);
    rec('dm.paintMs 结算且 <5ms', typeof st['dm.paintMs'] === 'number' && st['dm.paintMs'] < 5, st['dm.paintMs']);
    rec('dm.visible > 0', (st['dm.visible'] || 0) > 0, st['dm.visible']);
    rec('dm.sprites > 0', (st['dm.sprites'] || 0) > 0, st['dm.sprites']);
    var px1 = sampleAlpha();
    rec('画布有像素', px1 > 0, px1);

    // —— 时间推进：弹幕移动，画面必须变化
    v.__pump(30);
    var px2 = sampleAlpha();
    rec('播放中持续重绘（采样变化）', px2 >= 0 && px1 !== px2, px1 + '→' + px2);

    // —— 全部过期：跳到 60s，head 应扫尽全部条目并释放位图
    v.currentTime = 60;
    v.__pump(130); // >60 帧：顺带触发下一次埋点结算
    var st2 = window.__ACSV_TEST__.getStats();
    var px3 = sampleAlpha();
    rec('过期后位图清零', st2['dm.sprites'] === 0, st2['dm.sprites']);
    rec('过期后画布清空', px3 === 0, px3);

    // —— 从"窗口耗尽"状态向后 seek：head 重置、弹幕恢复绘制
    v.currentTime = 0.1;
    v.__pump(5);
    var px4 = sampleAlpha();
    rec('seek 回退后恢复绘制', px4 > 0, px4);

    // —— 暂停中发本地弹幕：暂停补偿帧路径
    v.paused = true;
    var frameBefore = window.__ACSV_TEST__.getStats()['dm.frame'] || 0;
    layer.addLocal({ text: '本地回显弹幕', at: v.currentTime * 1000 + 200, mode: 1, color: '#00ff44', size: 25 });
    var px5 = sampleAlpha();
    var frameAfter = window.__ACSV_TEST__.getStats()['dm.frame'] || 0;
    rec('暂停中发弹幕可见', px5 > 0, px5);
    rec('暂停中主动补帧', frameAfter > frameBefore, frameBefore + '→' + frameAfter);

    // —— 有序插入：at=15300 应插到 15000 与 16000 之间（非队尾），扫描仍能命中
    layer.addLocal({ text: '第二条回显', at: 15300, mode: 1, color: '#00ddff', size: 25 });
    v.currentTime = 15.3;
    v.paused = false;
    v.__pump(5);
    var px6 = sampleAlpha();
    rec('乱序时间点绘制命中', px6 > 0, px6);

    // ============ 高级弹幕（0.9.204）：绝对定位 + 帧插值，独立于轨道/位图缓存 ============
    // ext 形状照真机样本（§10.13：contentType 0 / anchor 九宫格 / pos 为 0–100 百分比 /
    // durationTime = 各帧 moveTime 之和 / timingFunction linear）
    layer.setItems([]); // 清空经典弹幕，像素判定不被污染
    var ext = JSON.stringify({
      id: 'adv1', content: '█', contentType: 0, startTime: 0, durationTime: 10000, anchor: 0,
      wordStyle: { font: 'SimHei', size: 60, bold: true, stroke: false, color: '#00ff00' },
      scale: { x: 1, y: 1, z: 1 }, rotate: { x: 0, y: 0, z: 0 }, zIndex: 50,
      animationFrames: [{ from: { pos: { x: 0, y: 0 } }, to: { pos: { x: 0, y: 0 } },
        timingFunction: 'linear', staticTime: 0, moveTime: 10000 }]
    });
    var advModel = Dm.parseAdvExt && Dm.parseAdvExt(ext);
    rec('高级弹幕 ext 解析（浏览器内走真实解析链）', !!advModel && advModel.frames.length === 1,
      advModel ? 'anchor=' + advModel.anchor + ' dur=' + advModel.duration : 'null');
    v.currentTime = 5; v.paused = false;
    var added = layer.addAdvanced([{ id: 'adv1', at: 0, roleId: 0, adv: advModel }]);
    rec('addAdvanced 收录', added === 1, added);
    rec('addAdvanced 幂等（同 id 重复喂入不重复计）',
      layer.addAdvanced([{ id: 'adv1', at: 0, roleId: 0, adv: advModel }]) === 0);
    v.__pump(70); // 埋点每 60 帧结算一次
    var stA = window.__ACSV_TEST__.getStats();
    rec('dm.adv 埋点=1', stA['dm.adv'] === 1, stA['dm.adv']);
    // 锚点 0（左上）+ pos(0,0)：字符必须落在左上角，右下角必须是空的（绝对定位没跑偏）
    rec('高级弹幕落在锚点位置（左上不透明）', opaqueAt(0.02, 0.04) === 1, opaqueAt(0.02, 0.04));
    rec('高级弹幕未撒满画面（右下透明）', opaqueAt(0.85, 0.85) === 0, opaqueAt(0.85, 0.85));
    // 越过 durationTime（10s）：不再绘制
    v.currentTime = 12;
    v.__pump(3);
    rec('过期后不再绘制', opaqueAt(0.02, 0.04) === 0, opaqueAt(0.02, 0.04));
    // 向后 seek 回窗口内：advHead 重置后必须重现
    v.currentTime = 1;
    v.__pump(3);
    rec('seek 回退后重现（advHead 归零）', opaqueAt(0.02, 0.04) === 1, opaqueAt(0.02, 0.04));
    // 无帧模型（真机残包）/ 坏 JSON：一律不收（不静默画错）
    rec('坏 JSON → null', Dm.parseAdvExt('{oops') === null);
    rec('无帧模型被拒收', layer.addAdvanced([{ id: 'adv2', at: 0, adv: { frames: [], content: 'x', duration: 100, wordScale: 1 } }]) === 0);

    layer.destroy();
    rec('destroy 后无画布残留', !document.querySelector('.acsv-dmcanvas'), '');
    window.__DM_RESULTS__.done = true;
  }
</script>
</body>
</html>
