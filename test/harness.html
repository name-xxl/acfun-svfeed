<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AcFun 竖滑页 - 本地验证 harness</title>
<style>
  body { margin: 0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f5; }
  .note { padding: 12px 20px; color: #666; }
</style>
</head>
<body>
<div class="note">本地验证 harness：mock 数据运行。断言结果写入 <code>window.__HARNESS_RESULTS__</code>。
  场景：<code>?case=smoke|homeswitch|fastswipe|resolvefail</code>（默认 smoke）；
  <code>?bundle=release</code> 加载正式构建（默认 debug，带 __ACSV_TEST__/__dbg）；
  <code>?src=home</code> 人工预览推荐模式。测试媒体统一映射为免 h264 依赖的 webm。</div>
<script src="feed-sample.js"></script>
<script src="home-sample.js"></script>
<script src="my-sample.js"></script>
<script src="state-spy.js"></script><!-- __spyState(类名)：状态被谁改了观察钩子（用法见文件头） -->
<script>
  // ============ 场景预处理（须在 bundle 加载前：改 mock / 写 localStorage） ============
  var CASE = (location.search.match(/[?&]case=([\w-]+)/) || [])[1] || 'smoke';
  var RELEASE = /[?&]bundle=release/.test(location.search);
  // 官方 weblog 管道 stub：debug 构建 unsafeWindow===window，reportLeave 读 window.weblog。
  // 所有场景无条件 stub——非 home 场景 cap.watchReport=false 不会触达；调用记录供断言
  window.__WL_CALLS = [];
  window.weblog = {
    impr: {
      getCurrentReqID: function () { return 'req-mock'; },
      getCurrentGroupID: function () { return 'grp-mock'; }
    },
    sendImmediately: function (channel, payload) {
      window.__WL_CALLS.push({ channel: channel, payload: payload });
    }
  };
  // 页面级错误捕获（bundle 求值期错误发生在 dbgInit 之前，__dbg 抓不到）
  window.__errs = [];
  window.addEventListener('error', function (e) {
    window.__errs.push((e.message || 'res:' + (e.target && e.target.tagName || '?'))
      + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0));
  }, true);
  window.__HARNESS_RESULTS__ = { case: CASE, bundle: RELEASE ? 'release' : 'debug', results: [], done: false };
  function rec(name, pass, info) { window.__HARNESS_RESULTS__.results.push({ name: name, pass: !!pass, info: info == null ? '' : String(info) }); }

  // 走 home mock 的场景（其余默认 sv；显式 ?src=home 保持人工预览语义）
  var HOME_CASES = { homeswitch: 1, resolvefail: 1, prewarm: 1, 'quality-switch': 1, 'watch-report': 1 };
  if (HOME_CASES[CASE] || /[?&]src=home/.test(location.search)) {
    try { localStorage.setItem('acsv-source', 'home'); } catch (e) { }
  } else {
    try { localStorage.removeItem('acsv-source'); } catch (e) { }
  }
  // 深链场景（0.9.72）：源记忆故意留「推荐」，验证地址栏深链的 id 空间标记能压过持久化偏好
  // （这是「粘贴分享链接却重新随机一屏」的原始复现条件：旧代码 source=home 直接丢弃深链）
  if (CASE === 'deeplink-switch') { try { localStorage.setItem('acsv-source', 'home'); } catch (e) { } }
  // 深链的 hash 必须在本 bundle 求值前写好——boot 的 toggle 在 document-end 读 location.hash。
  // 其余场景一律是 bundle 加载后 300ms 才设 hash（见文件尾），那种时序走不到「冷启动深链」路径。
  // 目标 id 都取样例里**非首条**（首条会被随机流首条蒙对，断言失去意义）
  var DEEP_HASH = {
    'deeplink-sv': '#svfeed/v/11053531',     // 小视频标记形态（feed-sample 第 7 条）
    'deeplink-bare': '#svfeed/11053531',     // 0.9.72 前的历史裸形态：无标记，靠探测出 meow
    'deeplink-ac': '#svfeed/a/48867212',     // 推荐标记形态（home-sample 首条 href）
    'deeplink-switch': '#svfeed/v/11053531', // 源记忆=home 下也必须落到小视频
    'deeplink-miss': '#svfeed/a/99999999999' // 两个 id 空间都查不到：必须错误盒，不许随机流
  };
  if (DEEP_HASH[CASE]) {
    location.hash = DEEP_HASH[CASE];
    // douga/info 桩：ac 深链的解析端点（生产 = api-new.app.acfun.cn/rest/app/douga/info）。
    // key 收窄到 'douga/info' 单端点，防误伤其他请求；非白名单 id 回 result≠0 走未命中分支
    window.__ACSV_MOCK_FORM__ = {
      'douga/info': function (body, url) {
        var id = (String(url).match(/dougaId=(\d+)/) || [])[1];
        if (id !== '48867212') return { result: 1 };
        return {
          result: 0, videoList: [{ id: 'mock-douga-' + id }],
          title: '深链推荐视频', coverUrl: 'https://i.example/deep.jpg'
        };
      }
    };
  }
  // 测试媒体统一换本地 webm（免 h264 依赖 + 免外网抖动；cc0，来自 MDN flower 样片）。
  // 必须绝对 URL：normalize() 的直链过滤器要求 ^https?:
  var TEST_WEBM = new URL('media/flower.webm', location.href).href;
  window.__ACSV_TEST_WEBM__ = TEST_WEBM; // my-sample 的 playInfo mock 桩在调用期取
  (window.__ACSV_MOCK_HOME__ || []).forEach(function (c) { c.mockUrl = TEST_WEBM; });
  ((window.__ACSV_MOCK__ || {}).feed || []).forEach(function (r) {
    ((r.playInfo || {}).videoUrls || []).forEach(function (u) { if (u) u.url = TEST_WEBM; });
  });
  if (CASE === 'resolvefail') {
    try { delete window.__ACSV_MOCK_HOME__[0].mockUrl; } catch (e) { } // 解析必失败 → slide0 应落 error 态
  }
  if (CASE === 'cdn-fallback') {
    // 首条 sv 直链改为 [坏地址, 好地址]：video error → 自动换同档备用 CDN
    var r0 = (window.__ACSV_MOCK__ || {}).feed && window.__ACSV_MOCK__.feed[0];
    if (r0 && r0.playInfo) r0.playInfo.videoUrls = [{ url: location.origin + '/nope-404.mp4' }, { url: TEST_WEBM }];
  }
</script>
<script>
  // 按 ?bundle= 决定加载哪个构建（解析期 document.write，保证顺序）；`?v=` 时间戳破缓存——
  // 手工调试用静态服务（无缓存头）时浏览器会缓存旧 bundle，出现"改了没生效"（0.9.71 踩实：
  // 视图头标题已删但页面仍跑旧包）；harness runner 场景不受影响，此改动只保手工流不假红
  document.write('<script src="../acfun-svfeed.' + (RELEASE ? '' : 'debug.') + 'user.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
  // ============ 场景执行（bundle 已同步加载完） ============
  (function () {
    var TEST = window.__ACSV_TEST__;
    function feed() { try { return TEST.call('feed'); } catch (e) { return null; } }
    function q(sel) { return document.querySelector(sel); }
    function slide(i) { return q('.acsv-slide[data-idx="' + i + '"]'); }
    function cur() { var f = feed(); return f ? f.current : -1; }
    function key(k) { window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true })); }
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function waitFor(fn, timeout) {
      return new Promise(function (res) {
        var t0 = Date.now();
        (function tick() {
          var v = null;
          try { v = fn(); } catch (e) { }
          if (v) return res(v);
          if (Date.now() - t0 > (timeout || 15000)) return res(null);
          setTimeout(tick, 150);
        })();
      });
    }
    function firstVideoReady(i) {
      var s = slide(i), v = s && s.querySelector('video');
      return !!(s && s.dataset.state === 'ready' && v && !v.paused && v.currentTime > 0);
    }
    // 顶栏四界面复用（0.9.73）：视图态顶栏必须真实可见——offsetParent + 层级压过视图容器
    // （0.9.62 黑屏教训：只看"元素存在/内联值"会被"查得到但被盖住"骗过）+ seg 真隐藏
    // （名义隐藏时点它会静默重置背后 feed）+ 旧的视图头已删 + 正文不钻到顶栏下 + 72px 精确
    function topbarInView(prefix) {
      var t = q('.acsv-top'), v = q('.acsv-view'), tr = q('.acsv-top-right');
      var tz = t ? parseInt(getComputedStyle(t).zIndex, 10) : NaN;
      var vz = v ? parseInt(getComputedStyle(v).zIndex, 10) : NaN;
      rec(prefix + '-topbar-visible', !!(t && v && t.offsetParent !== null && tz > vz),
        t ? ('z=' + tz + '/' + vz + ' h=' + t.offsetHeight) : 'no-topbar');
      rec(prefix + '-topbar-right-visible', !!(tr && tr.offsetParent !== null));
      rec(prefix + '-seg-hidden', (function () {
        var s = q('.acsv-seg');
        return !!s && getComputedStyle(s).display === 'none';
      })());
      rec(prefix + '-no-head', !q('.acsv-view-head'));
      rec(prefix + '-body-below-topbar', (function () {
        var b = q('.acsv-view-body');
        return !!(b && t && b.getBoundingClientRect().top >= t.getBoundingClientRect().bottom - 0.5);
      })());
      rec(prefix + '-topbar-72', !!t && t.offsetHeight === 72, t ? 'h=' + t.offsetHeight : 'no-bar');
    }

    async function run() {
      var root = await waitFor(function () { return document.getElementById('acsv-root'); }, 15000);
      rec('mount', !!root);
      if (!root) { finish(); return; }

      if (CASE === 'smoke') {
        rec('first-video-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        key('ArrowDown');
        // release 构建无 __ACSV_TEST__（读不到 current）：跳过索引断言，非死路
        rec('next-on-arrowdown', !TEST ? true : !!(await waitFor(function () { return cur() === 1; }, 5000)),
          TEST ? '' : 'skip:release');
        await wait(1500);
        var vids = document.querySelectorAll('#acsv-root video');
        // 窗口 [cur-1, cur+1]：cur/cur+1 挂新 video，cur-1 保留旧 video（已暂停）→ 上限 3
        rec('videos-capped', vids.length <= 3, 'count=' + vids.length);
        key('Escape');
        rec('esc-exits', !!(await waitFor(function () { return !document.getElementById('acsv-root'); }, 5000)));

      } else if (CASE === 'homeswitch') {
        rec('home-first-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        var f = feed();
        rec('home-resolved', !!(f && f.items[0] && f.items[0].hasUrls));

      } else if (CASE === 'fastswipe') {
        rec('first-video-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        for (var i = 0; i < 4; i++) { key('ArrowDown'); await wait(150); }
        await wait(3000); // 等滚动吸附/窗口回收收敛
        var c = cur(), vids2 = document.querySelectorAll('#acsv-root video'), others = 0;
        Array.prototype.forEach.call(vids2, function (v) {
          var s = v.closest('.acsv-slide');
          if (s && Number(s.dataset.idx) !== c && !v.paused) others++;
        });
        rec('video-count-capped', vids2.length <= 3, 'count=' + vids2.length + ' cur=' + c);
        rec('only-current-plays', others === 0, 'othersPlaying=' + others);

      } else if (CASE === 'resolvefail') {
        rec('resolve-fail-error-state', !!(await waitFor(function () {
          var s = slide(0);
          return s && s.dataset.state === 'error';
        }, 20000)));

      } else if (CASE === 'prewarm') {
        rec('first-video-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        key('ArrowDown');
        rec('next-on-arrowdown', !!(await waitFor(function () { return cur() === 1; }, 5000)));
        // 等防抖(500ms)+解析。cur=1 时渲染窗口只解析到 idx2；idx3 有 urls 只能来自预热
        await wait(2500);
        var f = feed();
        var it3 = f && f.items[3];
        rec('prewarm-cur2-resolved', !!(it3 && it3.hasUrls), 'items=' + (f ? f.items.length : 0));
        rec('preconnect-injected', !!document.querySelector('link[rel="preconnect"]'));
        var st = TEST.getStats();
        rec('prewarm-counted', (st.prewarm || 0) >= 1, 'stats=' + JSON.stringify(st));

      } else if (CASE === 'stall-frozen') {
        // 模拟缝：过滤看门狗的 rVFC 帧回调，真实 currentTime 照走 → FROZEN 可确定性复现
        rec('first-video-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        TEST.call('setStallSim', 'frozen');
        var okF = await waitFor(function () {
          var s = TEST.getStats();
          // rVFC 饿死的面板（如后台内嵌页）拿不到检测延迟，用 novfc 标记放行
          return s['stall.frozen'] >= 1 && (s['stall.detectLt800'] >= 1 || s['stall.novfc'] >= 1);
        }, 8000);
        rec('frozen-detected', !!okF, 'stats=' + JSON.stringify(TEST.getStats()));
        TEST.call('setStallSim', 'off');
        var okBack = await waitFor(function () { return firstVideoReady(0); }, 15000);
        rec('recovers-after-sim-off', !!okBack);

      } else if (CASE === 'stall-slow') {
        rec('first-video-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        // DEGRADED 依赖帧节奏（EMA），rVFC 饿死的面板无法度量——先探针，饿死则诚实跳过
        var vfcLive = await new Promise(function (res) {
          var v = slide(0).querySelector('video'), n = 0;
          if (!v || !v.requestVideoFrameCallback) return res(false);
          function tick() { n++; if (n >= 3) return res(true); v.requestVideoFrameCallback(tick); }
          v.requestVideoFrameCallback(tick);
          setTimeout(function () { res(n >= 3); }, 2500);
        });
        rec('rvfc-live', true, vfcLive ? 'live' : 'skip:rVFC-starved');
        if (!vfcLive) { finish(); return; }
        TEST.call('setStallSim', 'slow');
        var okD = await waitFor(function () {
          return TEST.getStats()['stall.degraded'] >= 1;
        }, 12000);
        rec('slow-degraded-detected', !!okD, 'stats=' + JSON.stringify(TEST.getStats()));
        TEST.call('setStallSim', 'off');

      } else if (CASE === 'cdn-fallback') {
        var okC = await waitFor(function () { return firstVideoReady(0); }, 30000);
        rec('fallback-to-second-cdn', !!okC);
        var s3 = TEST.getStats();
        rec('cdn-retry-counted', (s3['recover.cdn'] || 0) >= 1, 'stats=' + JSON.stringify(s3));

      } else if (CASE === 'quality-switch') {
        rec('first-video-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        await wait(1500); // 攒一点进度
        var v0 = slide(0).querySelector('video');
        var tBefore = v0.currentTime;
        var cq = document.querySelectorAll('.acsv-cq');
        rec('menus-present', cq.length >= 3, 'cq=' + cq.length); // 清晰度/编码/缓冲
        cq[0].click(); // 打开清晰度菜单
        var qitems = document.querySelectorAll('.acsv-qitem');
        rec('quality-menu-items', qitems.length >= 2, 'n=' + qitems.length);
        var d0 = TEST.getStats()['session.dispose'] || 0;
        qitems[qitems.length - 1].click(); // 切到第二档
        var okQ = await waitFor(function () { return firstVideoReady(0); }, 15000);
        rec('playing-after-switch', !!okQ);
        // 进度续播是「playing 后 seek 回去」（session.resumeAt）：ready 观测与 seek 落地
        // 存在竞态（无头合成器上 seek 排队更晚），立即读会撞上 seek 前的 0.x 秒。
        // 暂停钉住自然推进，currentTime 就只剩 seek 一条路径可动——等它落位，确定性判定
        var v1 = slide(0).querySelector('video');
        if (v1) v1.pause();
        rec('progress-kept', !!(v1 && (await waitFor(function () {
          return v1.currentTime >= tBefore - 0.6;
        }, 5000))),
          'before=' + tBefore.toFixed(1) + ' after=' + (v1 ? v1.currentTime.toFixed(1) : '-'));
        rec('session-recreated', (TEST.getStats()['session.dispose'] || 0) > d0);
        // 0.9.45 切档同步前向邻居：预挂 slide1 重选档重建（dispose 计数 +2：slide0+slide1），
        // prewarm 已解析的 items[1]/[2] 重选档跟随新偏好——不再「隔一两个视频才生效」
        rec('session-fwd-rebuilt', (TEST.getStats()['session.dispose'] || 0) >= d0 + 2,
          'dispose=' + (TEST.getStats()['session.dispose'] || 0) + ' d0=' + d0);
        var fs = feed();
        rec('fwd-neighbor-qsync', !!fs && fs.items.length > 2
          && fs.items[1].qIdx === fs.items[0].qIdx && fs.items[2].qIdx === fs.items[0].qIdx,
          'qIdx=' + (fs ? fs.items.slice(0, 3).map(function (x) { return x.qIdx; }).join(',') : '-'));
        rec('fwd-neighbor-label', !!fs && fs.items.length > 2
          && fs.items[1].qLabel === fs.items[0].qLabel && fs.items[2].qLabel === fs.items[0].qLabel,
          'label=' + (fs ? fs.items.slice(0, 3).map(function (x) { return x.qLabel; }).join('|') : '-'));

      } else if (CASE === 'dispose-mid-recovery') {
        // 恢复进行中划走 2 格：旧会话离开渲染窗口 → 必须 dispose 整体静默
        // （监视器停止、无悬挂定时器继续顶针/计数）
        rec('first-video-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        TEST.call('setStallSim', 'frozen');
        await waitFor(function () { return TEST.getStats()['stall.frozen'] >= 1; }, 8000);
        var frozenAt = TEST.getStats()['stall.frozen'] || 0;
        var d0 = TEST.getStats()['session.dispose'] || 0;
        key('ArrowDown'); await wait(300);
        key('ArrowDown');
        await waitFor(function () { return cur() === 2; }, 5000);
        TEST.call('setStallSim', 'off'); // 先关模拟：此后不应再有冻结事件
        await wait(3000); // 留足时间暴露悬挂定时器
        var s4 = TEST.getStats();
        var v2 = slide(2) && slide(2).querySelector('video');
        rec('old-session-quiet', (s4['stall.frozen'] || 0) <= frozenAt + 2,
          'frozen ' + frozenAt + '->' + (s4['stall.frozen'] || 0));
        rec('session-disposed', (s4['session.dispose'] || 0) > d0, 'dispose ' + d0 + '->' + (s4['session.dispose'] || 0));
        rec('next-playing', !!(v2 && !v2.paused && v2.currentTime > 0));

      } else if (CASE === 'stall-visibility') {
        // 切回标签页基线重建后，冻结检测必须仍然存活（回归：重建后误分类放弃武装→永久失活）
        rec('first-video-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        TEST.call('setStallSim', 'frozen');
        var f1 = 0;
        await waitFor(function () { f1 = TEST.getStats()['stall.frozen'] || 0; return f1 >= 1; }, 8000);
        // 合成一次可见性变化：监视器会重建基线（mediaT=-1）——这里正是旧实现失活的入口
        document.dispatchEvent(new Event('visibilitychange'));
        var okV = await waitFor(function () {
          return (TEST.getStats()['stall.frozen'] || 0) >= f1 + 1;
        }, 10000);
        rec('frozen-detected-after-visibility', !!okV,
          'before=' + f1 + ' after=' + (TEST.getStats()['stall.frozen'] || 0));
        TEST.call('setStallSim', 'off');

      } else if (CASE === 'spinner-recover') {
        // 冻结恢复的「平滑 seek」边：waiting 打成 loading 后，顶针只引发 seeked 不引发
        // playing——画面恢复时转圈必须归位（真机实测回归）
        rec('first-video-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        var sv0 = slide(0).querySelector('video');
        sv0.dispatchEvent(new Event('waiting'));
        await wait(500); // 300ms 定时器到点 → 转圈
        rec('spinner-on-while-waiting', slide(0).dataset.state === 'loading');
        sv0.dispatchEvent(new Event('seeked')); // 顶针恢复：未暂停 + seek 完成
        await wait(500);
        rec('spinner-cleared-after-seeked', slide(0).dataset.state === 'ready' && !sv0.paused && !sv0.ended);

      } else if (CASE === 'watch-report') {
        // 观看历史上报（home 源）：离开（划走/关页）时上报最终进度。
        // 覆盖：≥门槛才报、payload 参数、pagehide 兜底、同秒位去重、门槛拦截。
        // 上报链只读离开时刻 currentTime，不依赖播放态——autoplay 被环境拦截也能验证
        function videoReady(i) {
          var s = slide(i), v = s && s.querySelector('video');
          return !!(s && v && v.duration > 0 && s.dataset.state !== 'error');
        }
        async function playUntil(i, minT) { // 真实播放攒进度（IAB 的 seekable 在激活播放前不展开，seek 不可靠）
          return !!(await waitFor(function () {
            var v = slide(i) && slide(i).querySelector('video');
            if (!v || !(v.duration > 0)) return false;
            if (v.paused && v.play) { try { v.play().catch(function () { }); } catch (e) { } }
            return v.currentTime >= minT;
          }, 20000));
        }
        function pauseAt(i) { // 冻结进度供精确断言
          var v = slide(i) && slide(i).querySelector('video');
          if (v) v.pause();
          return v ? v.currentTime : 0;
        }
        function watchCount() { return TEST.getStats()['report-watch'] || 0; }
        rec('first-media-ready', !!(await waitFor(function () { return videoReady(0); }, 25000)));

          && window.__ACSV_SEARCH_CALLS__ === srCalls,
          'calls=' + window.__ACSV_SEARCH_CALLS__ + '/' + srCalls);
        (function () { // 顶栏空词提交：只开视图出引导态，不发请求
          var i = q('.acsv-top .acsv-sbox input');
          i.value = '';
          i.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        })();
        rec('search-empty-nofetch', !!(await waitFor(function () {
          return location.hash === '#svfeed/search'
            && /输入关键词/.test((q('.acsv-sstate') || {}).textContent || '');
        }, 8000)) && window.__ACSV_SEARCH_CALLS__ === 3, 'calls=' + window.__ACSV_SEARCH_CALLS__);
        // 离开搜索视图 → 默认提交还原（handler 生命周期）+ 地址深链回填（分享链接/刷新回放的落点）
        key('Escape');
        rec('search-esc-back', !!(await waitFor(function () {
          return /^#svfeed(\/(?:[va]\/)?\d+)?$/.test(location.hash)
            && q('.acsv-view') === null;
        }, 8000)), location.hash);
        location.hash = 'svfeed/search/' + encodeURIComponent('深链词');
        rec('search-deeplink-prefill', !!(await waitFor(function () {
          var i = q('.acsv-top .acsv-sbox input');
          return q('.acsv-view').offsetParent !== null && !!i && i.value === '深链词'
            && document.querySelectorAll('.acsv-sgrid .acsv-scell').length === 3;
        }, 8000)), 'v=' + ((q('.acsv-top .acsv-sbox input') || {}).value));
        rec('search-calls-final', window.__ACSV_SEARCH_CALLS__ === 4, 'calls=' + window.__ACSV_SEARCH_CALLS__);
        rec('search-backbtn-shown', (function () { // 搜索结果页是深界面：来源不在 dock 上
          var b = q('.acsv-back-btn');
          return !!b && b.style.display !== 'none' && b.offsetParent !== null;
        })());
        var sBack = q('.acsv-back-btn'); // 收尾顺带钉返回键真路径：回来源（此例来源是竖刷）
        if (sBack) sBack.click();
        rec('search-backbtn-back', !!(await waitFor(function () {
          return location.hash === '#svfeed' && q('.acsv-view') === null;
        }, 8000)), location.hash);

      } else if (CASE === 'play-deep') {
        // 播放层深链（0.9.74）：地址栏直达 = 视图内自解析（不 reset 竖刷流、不切源）；坏形态
        // 出"链接不完整"；解析未命中出错误盒+重试；层内切清晰度不得污染竖刷邻居
        window.__ACSV_MOCK_FORM__ = window.__ACSV_MY_MOCK__;
        window.__ACSV_MOCK_DIRECT__ = { '488900': 1 }; // 直挂缝：webm 套 hls.js 会死在解析上
        rec('play-feed-up', !!(await waitFor(function () { return feed() && feed().items.length > 0; }, 15000)));
        var bufA = feed().items.length, curA = feed().current;
        location.hash = 'svfeed/play/a/488900'; // 冷进入（等价分享链接/刷新回放）
        rec('play-open', !!(await waitFor(function () {
          return !!q('.acsv-slide[data-ovl="1"]');
        }, 10000)), location.hash);
        rec('play-playing', !!(await waitFor(function () {
          var s = q('.acsv-slide[data-ovl="1"]');
          var v = s && s.querySelector('video');
          return !!v && !v.paused && v.currentTime > 0;
        }, 25000)), (function () {
          var s = q('.acsv-slide[data-ovl="1"]');
          var v = s && s.querySelector('video');
          return 'state=' + (s && s.dataset.state) + ' paused=' + (v && v.paused);
        })());
        rec('play-title', !!(await waitFor(function () {
          var t = q('.acsv-slide[data-ovl="1"] .acsv-title');
          return !!t && /测试视频488900/.test(t.textContent); // 深链解析回包带标题（douga/info）
        }, 8000)), (q('.acsv-slide[data-ovl="1"] .acsv-title') || {}).textContent);
        rec('play-no-arrows', !q('.acsv-slide[data-ovl="1"] .acsv-arrows'));
        rec('play-source-kept', (function () { // 不 setSource：播放解析与内容源无关
          var b = q('.acsv-seg-btn.on');
          return !!b && b.textContent === '小视频';
        })());
        rec('play-feed-untouched', feed().items.length === bufA && feed().current === curA,
          'items=' + feed().items.length + '/' + bufA + ' cur=' + feed().current + '/' + curA);
        // 顶栏：深界面出「向左返回」（顶栏左缘，样式同右组）；✕ 收回单一意义=退出脚本
        rec('play-backbtn-shown', (function () {
          var b = q('.acsv-back-btn');
          return !!b && b.style.display !== 'none' && b.offsetParent !== null;
        })());
        rec('play-backbtn-nopill', (function () { // 左键与居中搜索框不得压在一起
          var b = q('.acsv-back-btn'), p = q('.acsv-top .acsv-sbox');
          if (!b || !p) return false;
          return b.getBoundingClientRect().right <= p.getBoundingClientRect().left + 1;
        })());
        rec('play-x-single', (q('.acsv-top-right .acsv-tbtn:last-child') || {}).title === '退出');
        // 层内切清晰度：竖刷邻居 qIdx 必须零污染（syncFwdQuality 的 data-ovl 守卫——
        // 少了它 OVL_IDX+1 会打到竖刷第 0 条，把背后邻居重挂一遍）
        var qBefore = feed().items.map(function (x) { return x.qIdx; }).join(',');
        var cq = document.querySelectorAll('.acsv-slide[data-ovl="1"] .acsv-cq');
        if (cq.length) cq[0].click();
        var qi = document.querySelectorAll('.acsv-qitem');
        rec('play-quality-menu', qi.length >= 2, 'cq=' + cq.length + ' items=' + qi.length);
        if (qi.length > 1) qi[qi.length - 1].click();
        await wait(800);
        rec('play-quality-isolated', qi.length > 1
          && feed().items.map(function (x) { return x.qIdx; }).join(',') === qBefore,
          'before=' + qBefore + ' after=' + feed().items.map(function (x) { return x.qIdx; }).join(','));
        var backEl = q('.acsv-back-btn'); // 顶栏「向左返回」=回来源（此例来源是竖刷）
        if (backEl) backEl.click();
        rec('play-back', !!(await waitFor(function () {
          return location.hash === '#svfeed' && q('.acsv-slide[data-ovl="1"]') === null;
        }, 8000)), location.hash);
        rec('play-backbtn-hidden-feed', (function () {
          var b = q('.acsv-back-btn');
          return !!b && b.style.display === 'none';
        })());
        rec('play-x-feed', (q('.acsv-top-right .acsv-tbtn:last-child') || {}).title === '退出（Esc）');
        // 键盘重定向（0.9.74）：媒体键打层内那条，导航键与竖刷一动不能动（幽灵音频防线）
        location.hash = 'svfeed/play/a/488900';
        rec('play-open2', !!(await waitFor(function () {
          var v = q('.acsv-slide[data-ovl="1"] video');
          return !!v && !v.paused && v.currentTime > 0;
        }, 20000)));
        var curBeforeKey = feed().current;
        key('ArrowDown');
        await wait(300);
        rec('play-key-nonav', feed().current === curBeforeKey, 'cur=' + feed().current + '/' + curBeforeKey);
        var vk = q('.acsv-slide[data-ovl="1"] video');
        var m0 = vk && vk.muted;
        key('m');
        rec('play-key-mute', !!(await waitFor(function () {
          var v = q('.acsv-slide[data-ovl="1"] video');
          return !!v && v.muted !== m0;
        }, 5000)));
        rec('play-key-no-ghost', (function () {
          var vs = document.querySelectorAll('.acsv-scroller video');
          for (var i = 0; i < vs.length; i++) if (!vs[i].paused) return false;
          return true;
        })());
        key('c'); // 层内评论开合（0.9.74）：必须打层内那条，不是竖刷当前条
        rec('play-key-comments', !!(await waitFor(function () {
          var r = q('#acsv-root'), d = q('.acsv-drawer'), cs = TEST.call('comments');
          return !!r && r.classList.contains('acsv-with-comments') && !!d && d.classList.contains('open')
            && !!cs && String(cs.sourceId) === '488900';
        }, 6000)), JSON.stringify(TEST.call('comments')));
        key('c');
        rec('play-key-comments-close', !!(await waitFor(function () {
          var r = q('#acsv-root');
          return !!r && !r.classList.contains('acsv-with-comments');
        }, 6000)));
        key('Escape');
        rec('play-esc-back', !!(await waitFor(function () {
          return location.hash === '#svfeed' && q('.acsv-slide[data-ovl="1"]') === null;
        }, 8000)), location.hash);
        // 坏形态：缺 id → 视图内错误态（不静默）
        location.hash = 'svfeed/play';
        rec('play-badform', !!(await waitFor(function () {
          var v = q('.acsv-view');
          return !!v && /链接不完整/.test(v.textContent);
        }, 8000)));
        // 未命中：douga/info 回 result≠0 → 错误盒 + 重试
        window.__ACSV_MOCK_FORM__ = { 'douga/info': function () { return { result: 1 }; } };
        window.__ACSV_MOCK_DIRECT__ = {};
        location.hash = 'svfeed/play/a/999999999';
        rec('play-miss-errbox', !!(await waitFor(function () {
          var v = q('.acsv-view');
          return !!v && /视频加载失败/.test(v.textContent);
        }, 12000)));
        rec('play-miss-retry', !!q('.acsv-view .acsv-retry'));
        key('Escape');
        rec('play-miss-back', !!(await waitFor(function () { return location.hash === '#svfeed'; }, 8000)), location.hash);

      } else if (CASE === 'view-im' || CASE === 'view-im-narrow') {
        // 抽屉×视图避让冒烟（0.9.73）：视图里开私信抽屉 → 正文让位（宽视口右缘收窄到抽屉左缘，
        // 逐帧贴合同曲线）或降级纯覆盖（中窄视口，CFG.view.avoidW 护栏）；顶栏右组避让平移后
        // 仍可点；Esc 链 = 先关抽屉（视图保留）→ 再退竖刷；离开视图 = 浮层随视图收（对称收尾）。
        // 走 imOpenSmoke 模拟缝：真实避让路径（浮层栈 + 抽屉槽 + syncCommentVars），不拉 ImSdk /
        // 不依赖登录。宽窄两态由驱动设视口（view-im=1280 / view-im-narrow=1000，见 run-harness.mjs）
        var IMV_WIDE = CASE === 'view-im';
        window.__ACSV_MOCK_FORM__ = window.__ACSV_MY_MOCK__;
        location.hash = IMV_WIDE ? 'svfeed/my' : 'svfeed/zone';
        rec('imview-open', !!(await waitFor(function () {
          return q('.acsv-view').offsetParent !== null;
        }, 10000)));
        topbarInView('imview');
        var imvSmoke = TEST.call('imOpenSmoke');
        rec('imview-drawer-open', !!(imvSmoke && imvSmoke.open && imvSmoke.drawerConnected && imvSmoke.withComments),
          JSON.stringify(imvSmoke || {}));
        await wait(500); // 越过 .28s 抽屉滑入/正文收窄过渡
        rec('imview-body-geometry', (function () {
          var b = q('.acsv-view-body'), d = q('.acsv-msgdrawer');
          if (!b || !d) return false;
          var br = b.getBoundingClientRect(), dr = d.getBoundingClientRect();
          // 宽视口：正文右缘=抽屉左缘（同曲线过渡的稳态）；中窄视口：正文不动（right=0，纯覆盖）
          return IMV_WIDE ? Math.abs(br.right - dr.left) <= 2 : Math.abs(br.right - window.innerWidth) <= 2;
        })(), (function () {
          var b = q('.acsv-view-body'), d = q('.acsv-msgdrawer');
          if (!b || !d) return 'n/a';
          return 'bodyR=' + Math.round(b.getBoundingClientRect().right)
            + ' drawerL=' + Math.round(d.getBoundingClientRect().left) + ' vw=' + window.innerWidth;
        })());
        // 护栏的核心目的：正文不因收窄/挤压出现横向溢出（榜单 338px 定宽列的最窄可用宽推算）
        rec('imview-no-overflow', (function () {
          var b = q('.acsv-view-body');
          return !!b && b.scrollWidth <= b.clientWidth + 1;
        })());
        rec('imview-topbar-right-clear', (function () { // 右组避让平移生效：整体在抽屉左缘左侧
          var tr = q('.acsv-top-right'), d = q('.acsv-msgdrawer');
          if (!tr || !d) return false;
          return tr.getBoundingClientRect().right <= d.getBoundingClientRect().left + 1;
        })());
        rec('imview-buttons-clickable', (function () { // 私信/更新/✕ 被抽屉盖住即失去出口——必须真实渲染
          var btns = [q('.acsv-im-btn'), q('.acsv-upd-btn'), q('.acsv-top-right .acsv-tbtn:last-child')];
          return btns.every(function (b) { return !!b && b.offsetParent !== null && b.offsetWidth > 0; });
        })());
        // 搜索框让位（0.9.73 收口 0.9.72 遗留：右组左移会压到居中搜索框）：宽视口=收窄后与右组
        // 不重叠；窄视口（<CFG.view.avoidTopW=1012）=不可用即隐藏，只留右组
        rec('imview-pill-clear', (function () {
          var p = q('.acsv-top .acsv-sbox'), tr = q('.acsv-top-right');
          if (!p || !tr) return false;
          var vis = getComputedStyle(p).display !== 'none' && p.offsetParent !== null;
          if (!vis) return !IMV_WIDE;
          return p.getBoundingClientRect().right <= tr.getBoundingClientRect().left + 1;
        })(), (function () {
          var p = q('.acsv-top .acsv-sbox'), tr = q('.acsv-top-right');
          if (!p || !tr) return 'n/a';
          return 'pillR=' + Math.round(p.getBoundingClientRect().right)
            + ' groupL=' + Math.round(tr.getBoundingClientRect().left)
            + ' dw=' + Math.round(p.getBoundingClientRect().width);
        })());
        key('Escape'); // 栈顶=im → 先关抽屉（视图保留）
        rec('imview-esc-drawer', !!(await waitFor(function () {
          var d = q('.acsv-msgdrawer'), r = q('#acsv-root');
          return !!d && !d.classList.contains('open') && !!r && !r.classList.contains('acsv-with-comments');
        }, 5000)));
        rec('imview-view-kept', q('.acsv-view').offsetParent !== null
          && location.hash === (IMV_WIDE ? '#svfeed/my' : '#svfeed/zone'), location.hash);
        await wait(400); // 过渡回落
        rec('imview-restored', (function () {
          var b = q('.acsv-view-body');
          return !!b && Math.abs(b.getBoundingClientRect().right - window.innerWidth) <= 2;
        })(), (function () {
          var b = q('.acsv-view-body');
          return b ? 'bodyR=' + Math.round(b.getBoundingClientRect().right) + ' vw=' + window.innerWidth : 'n/a';
        })());
        key('Escape'); // 再 Esc → 回竖刷
        rec('imview-esc-view', !!(await waitFor(function () {
          return /^#svfeed(\/(?:[va]\/)?\d+)?$/.test(location.hash)
            && q('.acsv-view') === null;
        }, 8000)), location.hash);

      } else if (CASE === 'stall-healthy') {
        rec('first-video-playing', !!(await waitFor(function () { return firstVideoReady(0); }, 25000)));
        await wait(10000); // 正常播放 10s：不允许任何画质损伤；冻结计数有界（后台面板 rVFC 饿死时可能有无害顶针）
        var s2 = TEST.getStats();
        rec('no-quality-damage', !s2['stall.rung3'] && !s2['stall.rung4'] && !s2['stall.degradeDown'] && !s2['stall.giveup'],
          'stats=' + JSON.stringify(s2));
        rec('frozen-bounded', (s2['stall.frozen'] || 0) <= 4, 'frozen=' + (s2['stall.frozen'] || 0));
      }

      finish();
    }

    function finish() {
      var errs = (window.__dbg || []).filter(function (l) { return /^ERR:/.test(l); })
        .concat((window.__errs || []).filter(function (l) { return !/^res:/.test(l); }));
      rec('no-js-errors', errs.length === 0, errs.slice(0, 3).join(' | '));
      window.__HARNESS_RESULTS__.done = true;
    }

    // 挂载由 hash 设置触发（模拟用户从导航点进来）
    setTimeout(function () {
      if (!/^#\/?svfeed/.test(location.hash)) location.hash = 'svfeed';
      setTimeout(run, 0);
    }, 300);
  })();
</script>
</body>
</html>
