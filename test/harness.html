<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AcFun 竖滑页 - 本地验证 harness</title>
<style>
  body { margin: 0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f5; }
  .note { padding: 12px 20px; color: #666; }
</style>
</head>
<body>
<div class="note">本地验证 harness：mock 数据运行。断言结果写入 <code>window.__HARNESS_RESULTS__</code>。
  场景：<code>?case=&lt;已登记场景名&gt;</code>（默认 smoke；完整清单见 test/run-harness.mjs 的
  HARNESS_CASES 与 test/cases/*.js，两者由 test/check-cases.mjs 双向校验）；
  <code>?bundle=release</code> 加载正式构建（默认 debug，带 __ACSV_TEST__/__dbg）；
  <code>?src=home</code> 人工预览推荐模式。测试媒体统一映射为免 h264 依赖的 webm。</div>
<script src="feed-sample.js"></script>
<script src="home-sample.js"></script>
<script src="my-sample.js"></script>
<script src="state-spy.js"></script><!-- __spyState(类名)：状态被谁改了观察钩子（用法见文件头） -->
<script src="cases/feed.js"></script><!-- 场景体（0.9.81 自本文件原样搬迁；登记校验见 test/check-cases.mjs） -->
<script src="cases/stall.js"></script>
<script src="cases/hls.js"></script><!-- 0.9.164 hls.js 懒 eval -->
<script src="cases/views.js"></script>
<script src="cases/play.js"></script>
<script src="cases/related.js"></script>
<script src="cases/jingxuan.js"></script>
<script src="cases/deeplink.js"></script>
<script src="cases/upd.js"></script>
<script src="cases/msg.js"></script>
<script src="cases/boot.js"></script>
<script src="cases/settings.js"></script>
<script src="cases/member.js"></script><!-- 0.9.128 原生 /member 页内嵌广场（入口注入/就地展开/浅色皮肤/无壳浮层） -->
<script src="cases/relation.js"></script><!-- 0.9.142 关注分组全闭环（我的页分组 tab + rail 分组选择层） -->
<script src="cases/favfolders.js"></script><!-- 0.9.143 收藏夹全闭环（rail 选择层 + 我的页夹管理） --><!-- 0.9.142 关注分组全闭环（我的页分组 tab + rail 分组选择层） -->
<script>
  // ============ 场景预处理（须在 bundle 加载前：改 mock / 写 localStorage） ============
  var CASE = (location.search.match(/[?&]case=([\w-]+)/) || [])[1] || 'smoke';
  var RELEASE = /[?&]bundle=release/.test(location.search);
  // 不自动挂壳的场景（0.9.128）：在**无壳**条件下验证原生页行为（boot 分流/入口注入/内嵌）。
  // 该名单约束两处：run() 不等待 #acsv-root 挂载（无壳=场景前提，由场景体自证）；文末不强制
  // hash='svfeed'（否则会把壳意外挂起来）
  var NO_AUTOMOUNT = ['member-plaza'];
  // 官方 weblog 管道 stub：debug 构建 unsafeWindow===window，reportLeave 读 window.weblog。
  // 所有场景无条件 stub——非 home 场景 cap.watchReport=false 不会触达；调用记录供断言
  window.__WL_CALLS = [];
  window.weblog = {
    impr: {
      getCurrentReqID: function () { return 'req-mock'; },
      getCurrentGroupID: function () { return 'grp-mock'; }
    },
    sendImmediately: function (channel, payload) {
      window.__WL_CALLS.push({ channel: channel, payload: payload });
    }
  };
  // navigator.sendBeacon stub（0.9.87）：bundle 的嗅探层会包上本 stub（嗅探→缓存信封、
  // 直发→记录），断言消费 window.__BEACON_CALLS。真实浏览器此 API 恒存在，无 TM 兜底分支不受影响
  window.__BEACON_CALLS = [];
  navigator.sendBeacon = function (url, body) {
    window.__BEACON_CALLS.push({ url: String(url), body: typeof body === 'string' ? body : String(body) });
    return true;
  };
  // 账本对账场景（0.9.87）：bundle 求值前预置账本——模块 init 读账即"重启语义"
  //（Playwright 每场景都是新鲜页面加载，等价崩溃后重启；488901 账平、488902 过 TTL，
  //  都不该补报，且清洗后应从账上消失）
  if (CASE === 'watch-ledger-replay') {
    try {
      localStorage.setItem('acsvWatchLedger', JSON.stringify({
        '488900:21005858': { maxSec: 42, reportedSec: 10, ts: Date.now() },
        '488901:21005859': { maxSec: 30, reportedSec: 30, ts: Date.now() },
        '488902:21005860': { maxSec: 60, reportedSec: 5, ts: Date.now() - 25 * 3600 * 1000 }
      }));
    } catch (e) { }
  }
  // 页面级错误捕获（bundle 求值期错误发生在 dbgInit 之前，__dbg 抓不到）
  window.__errs = [];
  window.addEventListener('error', function (e) {
    window.__errs.push((e.message || 'res:' + (e.target && e.target.tagName || '?'))
      + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0));
  }, true);
  window.__HARNESS_RESULTS__ = { case: CASE, bundle: RELEASE ? 'release' : 'debug', results: [], done: false };
  function rec(name, pass, info) { window.__HARNESS_RESULTS__.results.push({ name: name, pass: !!pass, info: info == null ? '' : String(info) }); }

  // 走 home mock 的场景（其余默认 sv；显式 ?src=home 保持人工预览语义）
  // 0.9.89 起源记忆收编进设置层：写新键 acsv.s.source（JSON 标量）
  var HOME_CASES = { homeswitch: 1, resolvefail: 1, prewarm: 1, 'quality-switch': 1, 'watch-report': 1, 'watch-playlayer-pagehide': 1, 'watch-pagehide-beacon': 1, 'settings-open': 1, 'settings-migrate': 1, 'rel-drawer': 1, 'rel-layer': 1 };
  try {
    if (HOME_CASES[CASE] || /[?&]src=home/.test(location.search)) localStorage.setItem('acsv.s.source', '"home"');
    else localStorage.removeItem('acsv.s.source');
  } catch (e) { }
  // 深链场景（0.9.72）：源记忆故意留「推荐」，验证地址栏深链的 id 空间标记能压过持久化偏好
  // （这是「粘贴分享链接却重新随机一屏」的原始复现条件：旧代码 source=home 直接丢弃深链）
  if (CASE === 'deeplink-switch') { try { localStorage.setItem('acsv.s.source', '"home"'); } catch (e) { } }
  // 设置迁移场景（0.9.89）：bundle 前只预置**老键**（无新键）——首读收养路径的端到端取证。
  // 值域取自 docs/api-research.md §7 真值表；刻意选与默认不同的值（hevc≠avc、std≠mid、关≠开）
  if (CASE === 'settings-migrate') {
    try {
      localStorage.setItem('acsv-codec', 'hevc');
      localStorage.setItem('acsv-buf', 'std');
      localStorage.setItem('acsv-dm-on', '0');
      localStorage.setItem('acsv-sound-on', '1');
    } catch (e) { }
  }
  // 深链的 hash 必须在本 bundle 求值前写好——boot 的 toggle 在 document-end 读 location.hash。
  // 其余场景一律是 bundle 加载后 300ms 才设 hash（见文件尾），那种时序走不到「冷启动深链」路径。
  // 目标 id 都取样例里**非首条**（首条会被随机流首条蒙对，断言失去意义）
  var DEEP_HASH = {
    'deeplink-sv': '#svfeed/v/11053531',     // 小视频标记形态（feed-sample 第 7 条）
    'deeplink-bare': '#svfeed/11053531',     // 0.9.72 前的历史裸形态：无标记，靠探测出 meow
    'deeplink-ac': '#svfeed/a/48867212',     // 推荐标记形态（home-sample 首条 href）
    'deeplink-switch': '#svfeed/v/11053531', // 源记忆=home 下也必须落到小视频
    'deeplink-miss': '#svfeed/a/99999999999', // 两个 id 空间都查不到：必须错误盒，不许随机流
    'play-cold': '#svfeed/play/a/488900'      // 播放层直达（0.9.79）：分享链接冷启动不预热竖刷
  };
  if (DEEP_HASH[CASE]) {
    location.hash = DEEP_HASH[CASE];
    if (CASE === 'play-cold') {
      // 播放层直达：解析链同 view-my（douga/info 全量桩 + 直挂缝——webm 套 hls.js 会死在解析上）
      window.__ACSV_MOCK_FORM__ = window.__ACSV_MY_MOCK__;
      window.__ACSV_MOCK_DIRECT__ = { '488900': 1 };
    } else {
      // douga/info 桩：ac 深链的解析端点（生产 = api-new.app.acfun.cn/rest/app/douga/info）。
      // key 收窄到 'douga/info' 单端点，防误伤其他请求；非白名单 id 回 result≠0 走未命中分支
      window.__ACSV_MOCK_FORM__ = {
        'douga/info': function (body, url) {
          var id = (String(url).match(/dougaId=(\d+)/) || [])[1];
          if (id !== '48867212') return { result: 1 };
          return {
            result: 0, videoList: [{ id: 'mock-douga-' + id }],
            title: '深链推荐视频', coverUrl: 'https://i.example/deep.jpg'
          };
        }
      };
    }
  }
  // 测试媒体统一换本地 webm（免 h264 依赖 + 免外网抖动；cc0，来自 MDN flower 样片）。
  // 必须绝对 URL：normalize() 的直链过滤器要求 ^https?:
  var TEST_WEBM = new URL('media/flower.webm', location.href).href;
  window.__ACSV_TEST_WEBM__ = TEST_WEBM; // my-sample 的 playInfo mock 桩在调用期取
  (window.__ACSV_MOCK_HOME__ || []).forEach(function (c) { c.mockUrl = TEST_WEBM; });
  ((window.__ACSV_MOCK__ || {}).feed || []).forEach(function (r) {
    ((r.playInfo || {}).videoUrls || []).forEach(function (u) { if (u) u.url = TEST_WEBM; });
  });
  if (CASE === 'feed-slim') {
    // 长列表夹具（0.9.165 水位场景）：feed-sample（8 条）克隆到 40 条，meowId 偏移保唯一
    //（克隆发生在上面 TEST_WEBM 改写之后 ⇒ 直链继承本地 webm）。sv mock 单发全量入库，
    // 一次 fetchMore 即得长列表，无需分页驱动
    var fsBase = (window.__ACSV_MOCK__ || {}).feed || [];
    var fsGrown = [];
    for (var gi = 0; gi < 5; gi++) {
      fsBase.forEach(function (r) {
        var cp = JSON.parse(JSON.stringify(r));
        cp.meowId = Number(cp.meowId) + gi * 100000 + 600000;
        fsGrown.push(cp);
      });
    }
    if (window.__ACSV_MOCK__) window.__ACSV_MOCK__.feed = fsGrown;
  }
  if (CASE === 'resolvefail') {
    try { delete window.__ACSV_MOCK_HOME__[0].mockUrl; } catch (e) { } // 解析必失败 → slide0 应落 error 态
  }
  if (CASE === 'cdn-fallback') {
    // 首条 sv 直链改为 [坏地址, 好地址]：video error → 自动换同档备用 CDN
    var r0 = (window.__ACSV_MOCK__ || {}).feed && window.__ACSV_MOCK__.feed[0];
    if (r0 && r0.playInfo) r0.playInfo.videoUrls = [{ url: location.origin + '/nope-404.mp4' }, { url: TEST_WEBM }];
  }
  // 页面类型场景（0.9.88）：boot 按 location 分类分流，而 harness 恒跑在 /test/harness.html——
  // 必须在 bundle 求值前把 pathname 改到位（与 DEEP_HASH 同款时序契约，时序错=测的不是冷启动分流）。
  // 必须放本块**最后**：replaceState 改相对基准后上面 TEST_WEBM 那种相对解析会算错路径；
  // bundle 加载器同理改用绝对路径（见下方 script）
  var BOOT_PATH = {
    'boot-home': '/',             // 首页：全量初始化（样式先就位）
    'boot-video': '/v/ac99999999', // 视频页：仅基础设施（全量 CSS 不得注入）
    // 0.9.128 原生个人中心：/member/feeds 页面类型分流 + 无壳前提（配合下文 NO_AUTOMOUNT）
    'member-plaza': '/member/feeds'
  };
  if (BOOT_PATH[CASE]) {
    try { history.replaceState(null, '', BOOT_PATH[CASE] + location.search + location.hash); } catch (e) { }
  }
</script>
<script>
  // 按 ?bundle= 决定加载哪个构建（解析期 document.write，保证顺序）；`?v=` 时间戳破缓存——
  // 手工调试用静态服务（无缓存头）时浏览器会缓存旧 bundle，出现"改了没生效"（0.9.71 踩实：
  // 视图头标题已删但页面仍跑旧包）；harness runner 场景不受影响，此改动只保手工流不假红。
  // 走绝对路径（0.9.88）：BOOT_PATH 场景在 bundle 前 replaceState 改了 pathname，
  // '../' 相对基准会跟着漂到 /v/… 下解析错
  document.write('<script src="/acfun-svfeed.' + (RELEASE ? '' : 'debug.') + 'user.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
  // boot 分流快照（0.9.88）：此刻 bundle 已同步求值完、页面尾部的自动挂载（300ms）还没跑——
  // 这是「boot 跑完但尚未挂载」的唯一干净观察窗。boot-home / boot-video 场景断言消费
  window.__BOOT_SNAP__ = {
    style: !!document.getElementById('acsv-style'),
    root: !!document.getElementById('acsv-root'),
    dbg: (window.__dbg || []).slice()
  };
</script>
<script>
  // ============ 场景执行（bundle 已同步加载完） ============
  (function () {
    var TEST = window.__ACSV_TEST__;
    function feed() { try { return TEST.call('feed'); } catch (e) { return null; } }
    function q(sel) { return document.querySelector(sel); }
    function slide(i) { return q('.acsv-slide[data-idx="' + i + '"]'); }
    function cur() { var f = feed(); return f ? f.current : -1; }
    function key(k) { window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true })); }
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function waitFor(fn, timeout) {
      return new Promise(function (res) {
        var t0 = Date.now();
        (function tick() {
          var v = null;
          try { v = fn(); } catch (e) { }
          if (v) return res(v);
          if (Date.now() - t0 > (timeout || 15000)) return res(null);
          setTimeout(tick, 150);
        })();
      });
    }
    function firstVideoReady(i) {
      var s = slide(i), v = s && s.querySelector('video');
      return !!(s && s.dataset.state === 'ready' && v && !v.paused && v.currentTime > 0);
    }
    // 顶栏四界面复用（0.9.73）：视图态顶栏必须真实可见——offsetParent + 层级压过视图容器
    // （0.9.62 黑屏教训：只看"元素存在/内联值"会被"查得到但被盖住"骗过）+ seg 真隐藏
    // （名义隐藏时点它会静默重置背后 feed）+ 旧的视图头已删 + 正文不钻到顶栏下 + 72px 精确
    function topbarInView(prefix) {
      var t = q('.acsv-top'), v = q('.acsv-view'), tr = q('.acsv-top-right');
      var tz = t ? parseInt(getComputedStyle(t).zIndex, 10) : NaN;
      var vz = v ? parseInt(getComputedStyle(v).zIndex, 10) : NaN;
      rec(prefix + '-topbar-visible', !!(t && v && t.offsetParent !== null && tz > vz),
        t ? ('z=' + tz + '/' + vz + ' h=' + t.offsetHeight) : 'no-topbar');
      rec(prefix + '-topbar-right-visible', !!(tr && tr.offsetParent !== null));
      rec(prefix + '-seg-hidden', (function () {
        var s = q('.acsv-seg');
        return !!s && getComputedStyle(s).display === 'none';
      })());
      rec(prefix + '-no-head', !q('.acsv-view-head'));
      rec(prefix + '-body-below-topbar', (function () {
        var b = q('.acsv-view-body');
        return !!(b && t && b.getBoundingClientRect().top >= t.getBoundingClientRect().bottom - 0.5);
      })());
      rec(prefix + '-topbar-72', !!t && t.offsetHeight === 72, t ? 'h=' + t.offsetHeight : 'no-bar');
    }

    async function run() {
      if (NO_AUTOMOUNT.indexOf(CASE) === -1) {
        var root = await waitFor(function () { return document.getElementById('acsv-root'); }, 15000);
        rec('mount', !!root);
        if (!root) { finish(); return; }
      }
      // NO_AUTOMOUNT 场景：不等待挂壳——无壳前提由场景体自证（member-plaza 的 mp-no-shell）

      // 场景分发（0.9.81）：各场景在 test/cases/*.js 注册（自本文件原样搬迁，只加参数前置）。
      // 公共件经 __ACSV_H 传入；未知场景名显式失败（check-cases.mjs 静态拦截 + 页内兜底），
      // 不再出现「CASE 名拼错 → 零断言静默通过」
      window.__ACSV_H = {
        rec: rec, q: q, slide: slide, cur: cur, key: key, wait: wait, waitFor: waitFor,
        firstVideoReady: firstVideoReady, topbarInView: topbarInView, feed: feed,
        TEST: window.__ACSV_TEST__, CASE: CASE, RELEASE: RELEASE, finish: finish
      };
      var caseFn = window.__ACSV_CASES__ && window.__ACSV_CASES__[CASE];
      rec('case-known', !!caseFn, 'CASE=' + CASE);
      // 场景抛错不再沉默（0.9.143）：以前直接冒泡到分发器，finish 不跑 ⇒ done 永不为真
      // ⇒ 驱动层只报「120s 超时」（真错被吃掉，定位成本极高）。现将异常记成显式断言
      if (caseFn) {
        try { await caseFn(window.__ACSV_H); }
        catch (e) { rec('case-threw', false, String((e && e.message) || e)); }
      }
      finish();
    }

    var finished = false;
    function finish() {
      if (finished) return; // 场景内早退与分发器尾部各调一次：只结一次（no-js-errors 不重复）
      finished = true;
      var errs = (window.__dbg || []).filter(function (l) { return /^ERR:/.test(l); })
        .concat((window.__errs || []).filter(function (l) { return !/^res:/.test(l); }));
      rec('no-js-errors', errs.length === 0, errs.slice(0, 3).join(' | '));
      window.__HARNESS_RESULTS__.done = true;
    }

    // 挂载由 hash 设置触发（模拟用户从导航点进来）；NO_AUTOMOUNT 场景例外（声明在文件头）
    setTimeout(function () {
      if (NO_AUTOMOUNT.indexOf(CASE) === -1 && !/^#\/?svfeed/.test(location.hash)) location.hash = 'svfeed';
      setTimeout(run, 0);
    }, 300);
  })();
</script>
</body>
</html>
