<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AcFun 竖滑页 - 私信抽屉开启冒烟</title>
<style>
  body { margin: 0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f5; }
  pre { padding: 12px 20px; color: #333; }
</style>
</head>
<body>
<pre id="out">waiting…</pre>
<!-- 调试构建：testHook 模拟缝可用 -->
<script src="../acfun-svfeed.debug.user.js"></script>
<script>
  // ============ 私信抽屉开启冒烟（0.9.49 quoteChip 回归教训的哨兵场景） ============
  // imdrawer.imDrawerSmoke 模拟缝绕过登录门槛直建抽屉 DOM；本页只做断言记录。
  // 覆盖：骨架可建可开、quoteChip 是真实元素节点（工厂返回对象漏 .box 的同族回归）、
  // 输入栏/气泡容器在场；0.9.75 起加「列表↔会话双向平移」的动画契约（舞台裁剪/两面板位移/
  // 过渡时长与抽屉同源——时长单源化后逐帧贴合的前提就是它们必须相等）。
  window.__IM_RESULTS__ = { case: 'im-open', results: [], done: false };
  function rec(name, pass, info) {
    window.__IM_RESULTS__.results.push({ name: name, pass: !!pass, info: info == null ? '' : String(info) });
  }
  var pre = document.getElementById('out');
  setInterval(function () {
    var r = window.__IM_RESULTS__;
    pre.textContent = r.results.map(function (x) {
      return (x.pass ? 'PASS' : 'FAIL') + '  ' + x.name + (x.info ? '  (' + x.info + ')' : '');
    }).join('\n') + '\n' + (r.done ? 'done' : 'running…');
  }, 300);

  var t0 = Date.now();
  (function boot() {
    if (!window.__ACSV_TEST__) {
      if (Date.now() - t0 > 15000) { rec('env', false, 'bundle 未就绪'); window.__IM_RESULTS__.done = true; return; }
      return setTimeout(boot, 100);
    }
    try {
      Promise.resolve(run()).catch(function (e) {
        rec('执行异常', false, e && e.message);
        window.__IM_RESULTS__.done = true;
      });
    } catch (e) {
      rec('执行异常', false, e && e.message);
      window.__IM_RESULTS__.done = true;
    }
  })();

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function run() {
    var s = window.__ACSV_TEST__.call('imDrawerSmoke');
    if (!s) { rec('模拟缝', false, 'imDrawerSmoke hook 缺失'); window.__IM_RESULTS__.done = true; return; }
    rec('模拟缝', true);
    rec('捎句话出口已注册（0.9.114 imshare↔imdrawer 反边撤销哨兵）',
      window.__ACSV_TEST__.call('chatOpener') === true);
    rec('抽屉 DOM 已挂载且 open', s.drawerConnected && s.drawerOpen, 'open=' + s.drawerOpen);
    rec('quoteChip 是真实元素节点（0.9.49 回归哨兵）', s.quoteChipIsNode);
    rec('quoteChip 在抽屉内', s.quoteChipInDrawer);
    rec('输入框/发送键在场', s.input && s.send);
    rec('气泡容器已挂载', s.bubblesConnected);
    // ---- 0.9.75：切页动画契约（舞台裁剪 + 面板叠加 + 时长单源） ----
    var stage = document.querySelector('.acsv-im-stage');
    var listPane = document.querySelector('.acsv-im-listview');
    var chatPane = document.querySelector('.acsv-im-chatview');
    rec('舞台在场且裁剪（滑出面板不溢视口）', !!stage
      && getComputedStyle(stage).overflow === 'hidden' && getComputedStyle(stage).position === 'relative',
      stage ? ('ov=' + getComputedStyle(stage).overflow + ' pos=' + getComputedStyle(stage).position) : 'no-stage');
    rec('两面板绝对定位叠加', !!listPane && !!chatPane
      && getComputedStyle(listPane).position === 'absolute' && getComputedStyle(chatPane).position === 'absolute');
    rec('面板有 transform 过渡', (function () {
      var c = chatPane && getComputedStyle(chatPane);
      return !!(c && c.transitionProperty.indexOf('transform') >= 0 && parseFloat(c.transitionDuration) > 0);
    })(), (function () { var c = chatPane && getComputedStyle(chatPane); return c ? c.transitionProperty + ' ' + c.transitionDuration : 'n/a'; })());
    // 时长单源（--acsv-dw-t）：抽屉与让位组必须同值——0.9.75 单源化后这条是逐帧贴合的前提
    var drw = document.querySelector('.acsv-msgdrawer');
    rec('抽屉/面板时长同源（--acsv-dw-t）', (function () {
      if (!drw || !chatPane) return false;
      return getComputedStyle(drw).transitionDuration === getComputedStyle(chatPane).transitionDuration;
    })(), (function () {
      return drw && chatPane ? ('drawer=' + getComputedStyle(drw).transitionDuration + ' pane=' + getComputedStyle(chatPane).transitionDuration) : 'n/a';
    })());
    // 默认 list 态（chat 停在右侧 100%）+ 切到 chat（imPaneSmoke 只切状态类，不跑网络/轮询）
    var lp0 = listPane && listPane.getBoundingClientRect();
    var cp0 = chatPane && chatPane.getBoundingClientRect();
    rec('默认 list 态（会话停在右缘外）', !!lp0 && !!cp0 && cp0.left >= lp0.right - 1,
      lp0 && cp0 ? ('listR=' + Math.round(lp0.right) + ' chatL=' + Math.round(cp0.left)) : 'n/a');
    var p1 = window.__ACSV_TEST__.call('imPaneSmoke', 'chat');
    rec('切到会话：状态类与返回键', !!(p1 && p1.chatOn && p1.view === 'chat' && p1.backShown), JSON.stringify(p1));
    await wait(420); // 过渡回落（.28s + 余量）：翻类后立刻量等于量起点（变换是异步的）
    var lp1 = listPane.getBoundingClientRect(), cp1 = chatPane.getBoundingClientRect();
    // 双向平移：会话从右缘外滑到「列表原位」（左移 W），列表同步左移 W 退场
    rec('会话归位到列表原位、列表左移 W', Math.abs(cp1.left - lp0.left) <= 3
      && Math.abs((lp1.left - lp0.left) + Math.round(cp1.width)) <= 3,
      'chatL=' + Math.round(cp1.left) + '/listL0=' + Math.round(lp0.left) + ' listDx=' + Math.round(lp1.left - lp0.left) + ' W=' + Math.round(cp1.width));
    var p2 = window.__ACSV_TEST__.call('imPaneSmoke', 'list');
    rec('切回列表：状态与返回键复位', !!(p2 && !p2.chatOn && p2.view === 'list' && !p2.backShown), JSON.stringify(p2));
    await wait(420);
    var lp2 = listPane.getBoundingClientRect(), cp2 = chatPane.getBoundingClientRect();
    rec('切回后列表归位、会话再退右缘外', Math.abs(lp2.left - lp0.left) <= 2 && cp2.left >= lp2.right - 1,
      'listDx=' + Math.round(lp2.left - lp0.left) + ' chatL=' + Math.round(cp2.left) + ' listR=' + Math.round(lp2.right));
    // ---- 0.9.80：卡片装配迁共享层 imcard 后的抽屉皮肤（真机验收过的观感不变，结构回归进网） ----
    // 与 harness im-native 场景的分工：那边验原生皮肤与 enrich 时序，这里验暗色皮肤的类名/
    // 己方类/图标机制/封面隐藏（imCardSmoke 只装配不发网络，无内核依赖）
    var cs = window.__ACSV_TEST__.call('imCardSmoke');
    rec('卡片皮肤：整卡类名/己方类/链接', !!(cs && cs.vcardCls === 'acsv-im-vcard mine'
      && cs.vcardHref === 'https://www.acfun.cn/v/ac1'), cs && (cs.vcardCls + ' href=' + cs.vcardHref));
    rec('卡片皮肤：计数位与时长隐藏', !!(cs && cs.view === 'acsv-im-vcard-view|12'
      && cs.cmt === 'acsv-im-vcard-cmt|3' && cs.durHidden === true), cs && (cs.view + ' ' + cs.cmt));
    rec('卡片皮肤：标题位与图标绘制', !!(cs && cs.title === 'acsv-im-vcard-title|卡片标题'
      && cs.iconCls === 'acsvg-cicon' && cs.iconVar === 'url('), cs && (cs.title + ' ' + cs.iconCls + ' ' + cs.iconVar));
    rec('卡片皮肤：无封面时不设 src 且隐藏（不裂图）', !!(cs && cs.coverHidden === true), cs && String(cs.coverHidden));
    rec('评论卡皮肤：结构/锚点/来源小条', !!(cs && cs.cshareCls === 'acsv-im-cshare'
      && cs.cshareHref === 'https://www.acfun.cn/v/ac1#ncid=9' && cs.srct === '查看来源作品'
      && cs.quoteHasViewer === true && cs.srcimgHidden === true), cs && JSON.stringify(cs).slice(0, 140));
    // 动态卡（0.9.122）：根类复用评论卡 + 配图行 + 「查看动态」条；降级态（extra 被剥）
    rec('动态卡皮肤：根类/链接/配图行/查看动态条', !!(cs && cs.mcardCls === 'acsv-im-cshare'
      && cs.mcardHref === 'https://www.acfun.cn/moment/am5104327' && cs.mcardImgs === 1
      && cs.mcardQuoteHtml === true && cs.mcardSrct === '查看动态'),
      cs && JSON.stringify([cs.mcardCls, cs.mcardHref, cs.mcardImgs, cs.mcardSrct]).slice(0, 140));
    rec('动态卡降级（extra 被剥）：wire 文本可读 + 己方类 + 无配图行', !!(cs && cs.mcardDegraded === true));
    window.__IM_RESULTS__.done = true;
  }
</script>
</body>
</html>
